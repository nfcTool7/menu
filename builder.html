<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Конструктор меню</title>
<link rel="stylesheet" href="menu.css">
<style>
body{background:#EEF0F3;color:#1B1B1B}
.layout{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:24px;max-width:1000px;margin:0 auto;padding:20px 16px}
@media(max-width:760px){.layout{grid-template-columns:1fr}}
.panel{background:#FFFFFF;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;align-self:start}
.panel h2{margin:0;font-size:18px}.panel h3{margin:8px 0 0;font-size:13px;color:#5A5F66;text-transform:uppercase;letter-spacing:.06em}
label{font-size:12px;color:#5A5F66;display:flex;flex-direction:column;gap:3px}
input,select{font:inherit;padding:9px 10px;border-radius:10px;border:1px solid #C9CDD3;background:#FFFFFF;color:#1B1B1B}
button.b{font:inherit;font-weight:700;padding:12px;border-radius:12px;border:0;background:#1B1B1B;color:#FFFFFF;cursor:pointer}
button.b:disabled{opacity:.4;cursor:not-allowed}.b.alt{background:#E3E6EA;color:#1B1B1B}
.note{margin:0;font-size:13px;color:#5A5F66;line-height:1.4}.ok{color:#14733B}.bad{color:#B3261E}
.pv{border-radius:28px;overflow:hidden;background:var(--bg);max-width:440px;width:100%;margin:0 auto;border:8px solid #1B1B1B}
</style></head>
<body>
<div class="layout">
<div class="panel" id="form"><h2>Конструктор меню</h2>
</div>
<div><div class="pv" id="pv"></div></div>
</div>
<script src="menu.js"></script>
<script>
const GROUPS=[["Основное",[["name","Название заведения"],["tagline","Подзаголовок"],["logo","Знак логотипа (1-2 буквы)"],["gift","Подарок или акция"]]],
["Кнопки",[["booking","Ссылка на запись"],["tips","Ссылка на чаевые"],["site","Сайт"],["wifiName","Wi-Fi: название сети"],["wifiPass","Wi-Fi: пароль"]]],
["Соцсети",SOC.map(s=>["links."+s[0],s[1]])],["Отзывы",[["yandex","Яндекс Карты: ссылка на отзывы"],["gis","2ГИС: ссылка на отзывы"]]]];
let C=JSON.parse(JSON.stringify(DEFAULT));
const get=k=>k.split(".").reduce((o,p)=>o[p],C),set=(k,v)=>{const p=k.split("."),l=p.pop();p.reduce((o,x)=>o[x],C)[l]=v};
const pv=document.getElementById("pv"),form=document.getElementById("form"),inputs={};
function draw(){pv.dataset.theme=C.theme;pv.replaceChildren(buildMenu(C))}
const gen=()=>Array.from({length:6},()=>"abcdefghjkmnpqrstuvwxyz23456789"[Math.floor(Math.random()*31)]).join("");
const sel=$("select",{onchange:e=>{C.theme=e.target.value;draw()}},...THEMES.map(([v,l])=>$("option",{value:v},l)));sel.value=C.theme;
form.append($("label",{},"Цветовая тема",sel));
GROUPS.forEach(([g,fs])=>{form.append($("h3",{},g));fs.forEach(([k,l])=>{const i=$("input",{type:"text",oninput:e=>{set(k,e.target.value);draw()}});i.value=get(k)||"";inputs[k]=i;form.append($("label",{},l,i))})});
const host=location.hostname,OWN=host.endsWith(".github.io")?host.split(".")[0]:"",REPO=location.pathname.split("/")[1]||"";
const base=location.origin+location.pathname.replace(/\/[^\/]*$/,"");
const slug=$("input",{type:"text",value:gen(),oninput:upd}),tok=$("input",{type:"password",placeholder:"github_pat_..."});
try{tok.value=localStorage.getItem("gh")||""}catch(e){}
const info=$("p",{class:"note"}),valid=()=>/^[a-z0-9-]{1,40}$/i.test(slug.value),url=()=>base+"/?v="+slug.value;
const pub=$("button",{class:"b",type:"button",onclick:publish},"Опубликовать меню");
const cp=$("button",{class:"b alt",type:"button",onclick:async()=>{info.className="note";info.textContent=(await copy(url()))?"Ссылка скопирована ✓":"Не удалось скопировать"}},"Скопировать ссылку для NFC");
const list=$("select",{onchange:loadVenue},$("option",{value:""},"— новое заведение —"));
form.children[0].after($("label",{},"Изменить существующее меню",list));
form.append($("h3",{},"Публикация"),$("label",{},"Код меню в ссылке (латиница, цифры, дефис)",slug),pub,cp,info,
 $("label",{},"Токен доступа GitHub (вставьте один раз, запомнится в этом браузере)",tok));
function upd(){pub.disabled=cp.disabled=!valid();info.className="note"+(valid()?"":" bad");info.textContent=valid()?"Ссылка: "+url():"Код: только латиница, цифры и дефис."}
async function publish(){
  const t=tok.value.trim();
  if(!t){info.className="note bad";info.textContent="Вставьте токен доступа внизу формы.";return}
  try{localStorage.setItem("gh",t)}catch(e){}
  const api="https://api.github.com/repos/"+OWN+"/"+REPO+"/contents/venues/"+slug.value+".json";
  const H={Authorization:"Bearer "+t,Accept:"application/vnd.github+json"};
  info.className="note";info.textContent="Публикую…";pub.disabled=true;
  try{
    let sha;const g=await fetch(api,{headers:H});
    if(g.ok)sha=(await g.json()).sha;else if(g.status!==404)throw new Error("Нет доступа ("+g.status+"). Проверьте токен.");
    const bytes=new TextEncoder().encode(JSON.stringify(C,null,1));
    const body={message:"Меню "+slug.value,content:btoa(String.fromCharCode(...bytes))};if(sha)body.sha=sha;
    const p=await fetch(api,{method:"PUT",headers:{...H,"Content-Type":"application/json"},body:JSON.stringify(body)});
    if(!p.ok)throw new Error("Не удалось сохранить ("+p.status+"). Проверьте токен и его права.");
    info.className="note ok";info.textContent="Готово ✓ Меню заработает по ссылке через 1-2 минуты: "+url();
  }catch(e){info.className="note bad";info.textContent=e.message||"Нет связи с GitHub."}
  pub.disabled=!valid();
}
async function loadVenue(){
  const s=list.value;if(!s)return;
  try{const r=await fetch("venues/"+s+".json",{cache:"no-store"});if(!r.ok)throw 0;const d=await r.json();
    C={...JSON.parse(JSON.stringify(DEFAULT)),...d,links:{...DEFAULT.links,...(d.links||{})}};
    Object.entries(inputs).forEach(([k,i])=>i.value=get(k)||"");sel.value=C.theme;slug.value=s;draw();upd();
  }catch(e){info.className="note bad";info.textContent="Не удалось загрузить это меню."}
}
(async()=>{try{
  const r=await fetch("https://api.github.com/repos/"+OWN+"/"+REPO+"/contents/venues");if(!r.ok)return;
  const files=(await r.json()).filter(f=>f.name.endsWith(".json"));
  for(const f of files){const code=f.name.slice(0,-5);let n=code;
    try{const d=await (await fetch("venues/"+f.name,{cache:"no-store"})).json();n=(d.name||code)+" ("+code+")"}catch(e){}
    list.append($("option",{value:code},n))}
}catch(e){}})();
draw();upd();
</script></body></html>
